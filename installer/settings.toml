# psxrecomp user settings - written by the launcher. Safe to hand-edit.
# Overrides the bundled game.toml; the command line overrides this file.

[video]
renderer          = "opengl"
window_width      = 1920
fast_boot         = false
bios_hle          = true
fullscreen        = 0
render_thread = false
present_thread = false
frame_generation = false
vsync             = "on"
frame_interpolation = false
frame_interpolation_fps = 0
aspect_ratio      = "4:3"

[hotkeys]
rewind_pad = 1272
save_state_menu_pad = 2040
fast_forward_speed = 4
fast_forward_mode = "hold"
fast_forward_pad = 1528
fast_forward_toggle_pad = 0

[launcher]
skip_launcher = false

[netplay]
player_name = "Player"
lobby_url = "ws://netplay.retcomm.net:8765"

[disc]
path = "disc_image/game.cue"

[memcard]
dir     = "saves"
card1   = "saves/card1.mcd"
card2   = "saves/card2.mcd"
enable1 = true
enable2 = true

[controller]
p1_device = "keyboard"
p1_mode   = "digital"
p1_deadzone = 3276
p2_device = "none"
p2_mode   = "digital"
p2_deadzone = 3276
multitap  = true
multitap_analog = true
deadzone  = 3276

[localization]
language = "en"

[song_sync]
# Music-only offset (ms, -10000..10000) for the in-game dance song. 0 = default.
# Positive = music starts later. Negative = music starts that far into the song
# (it then ends that much before the dance ends).
# start_offset_ms is added to every dance song.
start_offset_ms = 0
# BAG2 songs
heat = 0
strike = 0
comet = 0
tsutomu = 0
kelly = 0
shorty = 0
pander = 0
kitty_n = 0
hiro = 0
bi_o = 0
capoeira = 0
robo_z = 0
columbo = 0
sushi_boy = 0
chichi_sally = 0
michael_doi = 0
# BAG1 songs
bag1_heat = 0
bag1_strike = 0
bag1_gaso = 0
