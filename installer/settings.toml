# psxrecomp user settings - written by the launcher. Safe to hand-edit.
# Overrides the bundled game.toml; the command line overrides this file.

[video]
renderer          = "opengl"
window_width      = 1920
fast_boot         = false
bios_hle          = true
fullscreen        = 0
render_thread = true
present_thread = true
frame_generation = false
vsync             = "immediate"
frame_interpolation = false
frame_interpolation_fps = 0
aspect_ratio      = "4:3"

[hotkeys]
rewind_pad = 1272
save_state_menu_pad = 2040
fast_forward_speed = 4
fast_forward_mode = "hold"
fast_forward_pad = 1528
fast_forward_toggle_pad = 0

[launcher]
skip_launcher = false

[disc]
path = "disc_image/game.cue"

[memcard]
dir = "saves"
card1 = "saves/card1.mcd"
card2 = "saves/card2.mcd"
enable1 = true
enable2 = true

[controller]
p1_device = "gamepad"
p1_mode   = "digital"
p1_deadzone = 3276
p2_device = "keyboard"
p2_mode   = "digital"
p2_deadzone = 3276
multitap  = false
multitap_analog = false
deadzone  = 3276

[localization]
language = "en"



[song_sync]
# Music-only offset (ms, -10000..10000) for the in-game dance song. 0 = default.
# Positive = music starts later. Negative = music starts that far into the song
# (it then ends that much before the dance ends).
# start_offset_ms is added to every dance song.
start_offset_ms = 0
# BAG2 songs
heat = 200
strike = 200
comet = 100
tsutomu = 200
kelly = 200
shorty = 200
pander = 200
kitty_n = 200
hiro = 200
bi_o = 200
capoeira = 200
robo_z = 200
columbo = 200
sushi_boy = 200
chichi_sally = 200
michael_doi = 200
# BAG1 songs
bag1_heat = 200
bag1_strike = 200
bag1_gaso = 200
