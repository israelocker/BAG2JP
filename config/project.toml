# Portable host defaults and reviewed policy. Machine locations belong in the local file.
schema_version = 1

[paths]
work_root = "_work"

[wsl]
distribution = "Ubuntu"

[build]
# Owner-approved parallelism, not a machine-local override.
jobs = 2

[pins]
# Preserve the existing workflow's revision-prefix semantics.
psxrecomp = "1a3fc0db"
recomp_ui = "3f1d6f1"

[harness]
# Prepared from the current runner; consumer migration is still pending.
# Deadlines change wait budgets only, never observed-state acceptance predicates.
state_timeout_seconds = 25.0
helper_timeout_seconds = 35.0
startup_timeout_seconds = 40.0
finish_timeout_seconds = 420.0
# Observed input contract (no calibration record); schema-locked, no local overrides.
key_hold_ms = 100
key_gap_ms = 350
menu_fade_seconds = 1.3

[recording]
# Prepared from bag2_record.py; recorder consumption is still pending.
# Host budgets only: never frame/audio acceptance gates or native constants.
fps = 60
max_seconds = 900.0
poll_seconds = 0.004
alive_check_seconds = 1.0
window_wait_seconds = 60.0
window_poll_seconds = 0.5
ffmpeg_quit_seconds = 30.0
ffmpeg_extra_seconds = 5
ffmpeg_stop_poll_seconds = 0.1
process_audio_extra_seconds = 60.0
