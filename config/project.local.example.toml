# Copy to project.local.toml, then add only verified machine locations.
# This template intentionally contains no personal/operational absolute paths.
# Relative values anchor to the repository, not the working directory.
schema_version = 1

[paths]
# build_root, experimental_install, stable_install, tools_root, work_root

[inputs]
# bag1_usa_disc, bag1_jp_disc, bag1_usa_extraction, bag1_jp_extraction
