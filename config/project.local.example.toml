# audio_probe, python_report, winshot_root, build_script, ffmpeg_review, ffmpeg_wgc
# ghidra_launcher, ghidra_project
# ffprobe_review, ffmpeg_look, recording_font (recording consumer pending)

[harness]
# Optional wait-budget overrides after a consumer adopts this section:
# state_timeout_seconds, helper_timeout_seconds, startup_timeout_seconds, finish_timeout_seconds

# Never override build.jobs, pins or locked harness input policy here.

