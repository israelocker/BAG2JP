# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Bust A Move 2 - Dance Tengoku Mix (Japan).bin"
cue_name = "Bust A Move 2 - Dance Tengoku Mix (Japan).cue"
boot_exe = "SLPM_862.19"
known_sizes = [559035120]
known_md5 = [
  "e66918a9a2e5102464c60eab26e39169",
]
known_sha1 = [
  "bb569316816b0e765adde10657e0cc7e89ade964",
]
known_crc32 = [
  "5cdade58",
