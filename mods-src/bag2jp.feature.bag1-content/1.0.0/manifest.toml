format_version = 11
id = "bag2jp.feature.bag1-content"
version = "1.0.0"
name = "Bust A Groove 1 content"
author = "BAG2JP"
description = "Content imported from Bust A Groove 1 (characters, stages, songs), selectable next to the BAG2 versions."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86219"
disc_sha256 = "fe8285f2ee5737680abe4ba20e53be9e029e0ab65ff2aa35c4695709bb0e5268"

[[feature]]
id = "bag1-stage"
name = "BAG1 stage support"
description = "Beat and score signals for BAG1 stage programs ported to BAG2. Needed by the BAG1 stage mods."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "bag1-stage"
id = "bag2jp.bag1_stage"

[[resource]]
feature = "bag1-stage"
id = "bag1_music"
label = "BAG1 songs"
description = "BAG1 FLAC songs (44.1 kHz stereo): <song>_japanese.flac, <song>_international.flac and <song>_cd.flac. Uses the existing Regional songs choice."
format = "directory"
default = "bag1_music"
required = false

[[feature]]
id = "select-popup"
name = "Character and stage selection"
description = "Choose character version and costume per player, then choose the Heat BAG1 or Heat BAG2 stage independently in the stage carousel."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "select-popup"
id = "bag2jp.charsel_popup"

[[resource]]
feature = "select-popup"
id = "popup_assets"
label = "Popup assets"
description = "HD font atlases and original Heat stage thumbnails used by the selection screens."
format = "directory"
default = "popup_assets"
required = false

[[feature]]
id = "bag1-heat"
name = "Heat (Bust A Groove 1)"
description = "Adds BAG1 Heat (model, moves, voices, stage and song 2Bad) next to BAG2 Heat. Each player can use either version."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "bag1-heat"
id = "bag2jp.bag1_versions"

[[plugin]]
feature = "bag1-heat"
id = "bag2jp.bag1_endings"

[[resource]]
feature = "bag1-heat"
id = "ending_movies"
label = "BAG1 ending movies"
description = "Original character ending movies, followed by a native BAG1 dance on the final stage."
format = "directory"
default = "ending_movies"
required = false

