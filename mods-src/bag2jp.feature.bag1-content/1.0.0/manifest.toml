format_version = 11
id = "bag2jp.feature.bag1-content"
version = "1.0.0"
name = "Bust A Groove 1 content"
author = "BAG2JP"
description = "Content imported from Bust A Groove 1 (characters, stages, songs), selectable next to the BAG2 versions."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86219"
disc_sha256 = "fe8285f2ee5737680abe4ba20e53be9e029e0ab65ff2aa35c4695709bb0e5268"

[[feature]]
id = "bag1-stage"
name = "BAG1 stage support"
description = "Beat and score signals for BAG1 stage programs ported to BAG2. Needed by the BAG1 stage mods."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "bag1-stage"
id = "bag2jp.bag1_stage"

[[option]]
feature = "bag1-stage"
id = "bag1_song_audio"
label = "BAG1 song audio"
description = "Audio for songs imported from Bust A Groove 1: the soundtrack CD re-aligned to the game's edit, or the game's own XA audio."
type = "choice"
default = "cd"

[[option.choice]]
value = "cd"
label = "CD quality"

[[option.choice]]
value = "game"
label = "Original (game XA)"

[[resource]]
feature = "bag1-stage"
id = "bag1_music"
label = "BAG1 songs"
description = "Folder with the BAG1 songs as FLAC (44.1 kHz stereo), named <song>_cd.flac / <song>_game.flac."
format = "directory"
default = "bag1_music"
required = false

[[feature]]
id = "bag1-heat"
name = "Heat (Bust A Groove 1)"
description = "Adds BAG1 Heat (model, moves, voices, stage and song 2Bad) next to BAG2 Heat. Each player can use either version."
group = "Gameplay"
default_enabled = true

[[plugin]]
feature = "bag1-heat"
id = "bag2jp.bag1_versions"

[[option]]
feature = "bag1-heat"
id = "heat_p1"
label = "Heat version, player 1"
description = "Which Heat player 1 gets. His stage follows the version of the player using Heat (player 1 first)."
type = "choice"
default = "bag1"

[[option.choice]]
value = "bag1"
label = "Bust A Groove 1"

[[option.choice]]
value = "bag2"
label = "Bust A Groove 2"

[[option]]
feature = "bag1-heat"
id = "heat_p2"
label = "Heat version, player 2"
description = "Which Heat player 2 (or the CPU) gets."
type = "choice"
default = "bag1"

[[option.choice]]
value = "bag1"
label = "Bust A Groove 1"

[[option.choice]]
value = "bag2"
label = "Bust A Groove 2"

[[overlay]]
feature = "bag1-heat"
target = "disc_user"
offset = 458823680
file = "payload/bag1_alt.bin"
sha256 = "d22d26e298abad6f16442aae99bc906ec24cfa51a47508c2523c47e0936cb398"
expected_sha256 = "c9f38b5727de35577ac94caded4441f23bcae129df65e9a7723e8eef826eff3c"

