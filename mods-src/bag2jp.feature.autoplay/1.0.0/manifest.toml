format_version = 5
id = "bag2jp.feature.autoplay"
version = "1.0.0"
name = "Autoplay"
author = "BAG2JP"
description = "The CPU dances for player 1 in 1P matches with frame-exact timing. For testing, unlocking content and watching endings."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLPM-86219"

[[feature]]
id = "autoplay"
name = "Autoplay (P1)"
description = "Off by default. When on, your own inputs are ignored during the dance. While playing, hold Select and press R1 (keyboard: Right Shift + W) to switch it off/on; the Active box sets how each session starts."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "autoplay"
id = "bag2jp.autoplay"

[[option]]
feature = "autoplay"
id = "active"
label = "Active at start"
description = "Autoplay starts switched on. Untick to start with it paused (Select + R1 in game resumes it)."
group = "Gameplay"
type = "boolean"
default = "true"

[[option]]
feature = "autoplay"
id = "p1_2p"
label = "P1 dances by itself in 2-player"
description = "Testing: in a 2-player game player 1 is danced by the CPU timing (no attacks)."
group = "Gameplay"
type = "boolean"
default = "false"

[[option]]
feature = "autoplay"
id = "p2_2p"
label = "P2 dances by itself in 2-player"
description = "Testing: in a 2-player game player 2 is danced by the CPU timing (no attacks)."
group = "Gameplay"
type = "boolean"
default = "false"
