format_version = 11
id = "bag2jp.localization.regional"
version = "1.0.0"
name = "Regional content"
author = "BAG2JP"
description = "Choose the Japanese or the international (Bust A Groove 2, SLUS-01159) version of each localized element."
resolver = "declarative"

[[target]]
game_id = "SLPM-86219"
disc_sha256 = "fe8285f2ee5737680abe4ba20e53be9e029e0ab65ff2aa35c4695709bb0e5268"

[[feature]]
id = "regional"
name = "Regional content (JP / International)"
description = "One choice per element. Changes apply the next time the game loads that screen or stage."
group = "Localization"
default_enabled = true

[[option]]
feature = "regional"
id = "title_screen"
label = "Title screen"
description = "Title logo, side banners and copyright line (international: Bust A Groove 2, (c)2000; also the ranking-screen logo)."
type = "choice"
default = "international"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[option]]
feature = "regional"
id = "boot_logos"
label = "Boot logos"
description = "Enix and Frame Graphics logos at start-up (international: English Frame Graphics logo, Enix (R))."
type = "choice"
default = "international"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[option]]
feature = "regional"
id = "hiro_icon"
label = "Hiro icon"
description = "Hiro's cigarette icon (Japanese) or the I-love-ME icon (international), in every icon strip, character select and his portraits."
type = "choice"
default = "international"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[option]]
feature = "regional"
id = "stage_signs"
label = "Stage signs"
description = "Neon City shop signs, Sushi Planet menu, TV studio standby screen (international versions replace logos that resembled real brands)."
type = "choice"
default = "international"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[option]]
feature = "regional"
id = "songs"
label = "Songs"
description = "Kitty-N, Kelly and Shorty themes in Japanese or in English, Comet theme original or re-recorded (international), and the song names on character select."
type = "choice"
default = "japanese"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[option.choice]]
value = "cd"
label = "CD quality (soundtrack, Japanese vocals)"

[[option]]
feature = "regional"
id = "announcer"
label = "Announcer voice"
description = "Menu narrator and title voice: DJ Dangerous (Japanese release) or DJ Mix Deadly (international)."
type = "choice"
default = "japanese"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[resource]]
feature = "regional"
id = "music_hq"
label = "CD-quality songs"
description = "Folder with the in-game songs re-built from the original soundtrack CD (FLAC, 44.1 kHz). Used when Songs = CD quality."
format = "directory"
default = "music_hq"
required = false

[[option]]
feature = "regional"
id = "command_buttons"
label = "Command buttons"
description = "Face-button icons in the dance commands: all yellow (Japanese) or PlayStation colours, green triangle, red circle, blue cross, pink square (international)."
type = "choice"
default = "international"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International"

[[option]]
feature = "regional"
id = "vs_screen"
label = "VS loading screen"
description = "2-player loading screen: name text (Japanese) or the arcade VS art with flames and portraits (international), rendered in HD."
type = "choice"
default = "international"

[[option.choice]]
value = "japanese"
label = "Japanese"

[[option.choice]]
value = "international"
label = "International (HD)"

[[resource]]
feature = "regional"
id = "vs_hd"
label = "VS screen layers"
description = "HD layers of the international VS screen (PNG), built from the US disc."
format = "directory"
default = "vs_hd"
required = false

[[plugin]]
feature = "regional"
id = "bag2jp.vs_screen"

[[plugin]]
feature = "regional"
id = "bag2jp.command_buttons"

[[plugin]]
feature = "regional"
id = "bag2jp.hq_songs"

